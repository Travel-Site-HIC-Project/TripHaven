<!DOCTYPE html>
<html lang="en" class="h-100" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cover Template · Bootstrap v5.3</title>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Theme script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    .bd-placeholder-img {
      font-size: 1.125rem;
      text-anchor: middle;
      user-select: none;
    }
    @media (min-width: 768px) {
      .bd-placeholder-img-lg { font-size: 3.5rem; }
    }
  </style>
</head>

<body class="d-flex h-100 text-center text-bg-dark">

  <!-- Icons -->
  <svg xmlns="http://www.w3.org/2000/svg" class="d-none">
    <symbol id="check2" viewBox="0 0 16 16">
      <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
    </symbol>
    <symbol id="circle-half" viewBox="0 0 16 16">
      <path d="M8 15A7 7 0 1 0 8 1v14zm0 1A8 8 0 1 1 8 0a8 8 0 0 1 0 16z"/>
    </symbol>
    <symbol id="moon-stars-fill" viewBox="0 0 16 16">
      <path d="M6 .278a.768.768 0 0 1 .08.858 7.208 7.208 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.787.787 0 0 1 .81.316.733.733 0 0 1-.031.893A8.349 8.349 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.752.752 0 0 1 6 .278z"/>
      <path d="M10.794 3.148a.217.217 0 0 1 .412 0l.387 1.162c.173.518.579.924 1.097 1.097l1.162.387a.217.217 0 0 1 0 .412l-1.162.387a1.734 1.734 0 0 0-1.097 1.097l-.387 1.162a.217.217 0 0 1-.412 0l-.387-1.162A1.734 1.734 0 0 0 9.31 6.593l-1.162-.387a.217.217 0 0 1 0-.412l1.162-.387a1.734 1.734 0 0 0 1.097-1.097l.387-1.162z"/>
    </symbol>
    <symbol id="sun-fill" viewBox="0 0 16 16">
      <path d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM8 0v2M8 13v2m8-5h-2M3 8H1m12.657-5.657l-1.414 1.415M4.464 11.536l-1.414 1.414m0-9.193L4.464 4.464M11.536 11.536l1.414 1.414"/>
    </symbol>
  </svg>



  <div class="cover-container d-flex w-100 h-100 p-3 mx-auto flex-column">
    <header class="mb-auto">
      <h3 class="float-md-start mb-0">Cover</h3>
      <nav class="nav nav-masthead justify-content-center float-md-end">
        <a class="nav-link active fw-bold" aria-current="page" href="#">Home</a>
        <a class="nav-link fw-bold" href="#">Features</a>
        <a class="nav-link fw-bold" href="#">Contact</a>
      </nav>
    </header>

    <main class="px-3">
      <h1>Cover your page.</h1>
      <p class="lead">Cover is a one-page template for building simple and beautiful home pages.</p>
      <form class="lead d-flex justify-content-center mt-4" style="max-width: 350px; margin:auto;">
        <input type="text" class="form-control me-2" placeholder="Search...">
        <button class="btn btn-light fw-bold border-white bg-white" type="submit">Go</button>
</form>
<!-- START DATE -->
<div class="text-center mt-4 fw-bold">Start Date</div>
<div class="d-flex justify-content-center mt-1">
  <select class="form-select mx-1" style="width: 110px;">
    <option disabled selected>Month</option>
    <option>January</option> <option>February</option> <option>March</option>
    <option>April</option> <option>May</option> <option>June</option>
    <option>July</option> <option>August</option> <option>September</option>
    <option>October</option> <option>November</option> <option>December</option>
  </select>

  <select class="form-select mx-1" style="width: 90px;">
    <option disabled selected>Day</option>
    <script>
      for(let i=1;i<=31;i++) document.write(`<option>${i}</option>`);
    </script>
  </select>

  <select class="form-select mx-1" style="width: 110px;">
    <option disabled selected>Year</option>
    <script>
      const y=new Date().getFullYear();
      for(let i=y;i<=y+3;i++) document.write(`<option>${i}</option>`);
    </script>
  </select>
</div>

<!-- END DATE -->
<div class="text-center mt-4 fw-bold">End Date</div>
<div class="d-flex justify-content-center mt-1">
  <select class="form-select mx-1" style="width: 110px;">
    <option disabled selected>Month</option>
    <option>January</option> <option>February</option> <option>March</option>
    <option>April</option> <option>May</option> <option>June</option>
    <option>July</option> <option>August</option> <option>September</option>
    <option>October</option> <option>November</option> <option>December</option>
  </select>

  <select class="form-select mx-1" style="width: 90px;">
    <option disabled selected>Day</option>
    <script>
      for(let i=1;i<=31;i++) document.write(`<option>${i}</option>`);
    </script>
  </select>

  <select class="form-select mx-1" style="width: 110px;">
    <option disabled selected>Year</option>
    <script>
      const year=new Date().getFullYear();
      for(let i=year;i<=year+3;i++) document.write(`<option>${i}</option>`);
    </script>
  </select>
</div>

    </main>

    <footer class="mt-auto text-white-50">
      <p>Cover template for <a href="https://getbootstrap.com/" class="text-white">Bootstrap</a>.</p>
    </footer>
  </div>

</body>
</html>
