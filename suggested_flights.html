<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cover Template · TripHaven</title>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .bd-placeholder-img {
      font-size: 1.125rem;
      text-anchor: middle;
      user-select: none;
    }

    @media (min-width: 768px) {
      .bd-placeholder-img-lg {
        font-size: 3.5rem;
      }
    }
  </style>
</head>

<body>

  <!-- Icons -->
  <svg xmlns="http://www.w3.org/2000/svg" class="d-none">
    <symbol id="check2" viewBox="0 0 16 16">
      <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
    </symbol>
    <symbol id="chevron-right" viewBox="0 0 16 16">
      <path fill-rule="evenodd"
        d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z">
      </path>
    </symbol>
  </svg>

  <!-- Header/Nav from Blog Template -->
  <div class="container">
    <header class="border-bottom lh-1 py-3">
      <div class="row flex-nowrap justify-content-between align-items-center">
        <div class="col-4 pt-1"></div>
        <div class="col-4 text-center">
          <a class="blog-header-logo text-body-emphasis text-decoration-none" href="index.html">TripHaven</a>
        </div>
        <div class="col-4 d-flex justify-content-end align-items-center">
          <a class="link-secondary" href="#" aria-label="Search">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"
              stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              class="mx-3" role="img" viewBox="0 0 24 24">
              <title>Search</title>
              <circle cx="10.5" cy="10.5" r="7.5"></circle>
              <path d="M21 21l-5.2-5.2"></path>
            </svg>
          </a>
          <a class="btn btn-sm btn-outline-secondary" href="#">Sign up</a>
        </div>
      </div>
    </header>

    <div class="nav-scroller py-1 mb-3 border-bottom">
      <nav class="nav nav-underline justify-content-between">
        <a class="nav-item nav-link link-body-emphasis" href="travel.html">Travel</a>
        <a class="nav-item nav-link link-body-emphasis" href="reviews.html">Reviews</a>
        <a class="nav-item nav-link link-body-emphasis active" href="suggested_flights.html">Suggested Flights</a>
        <a class="nav-item nav-link link-body-emphasis" href="discounts.html">Discounts</a>
      </nav>
    </div>
  </div>

  <!-- Main Cover Content -->
  <main class="container text-center text-bg-dark py-5">
    <h1>Cover your page.</h1>
    <p class="lead">Cover is a one-page template for building simple and beautiful home pages.</p>

    <form class="lead d-flex justify-content-center mt-4" style="max-width: 350px; margin:auto;">
      <input type="text" class="form-control me-2" placeholder="Search...">
      <button class="btn btn-light fw-bold border-white bg-white" type="submit">Go</button>
    </form>

    <!-- Start Date -->
    <div class="text-center mt-4 fw-bold">Start Date</div>
    <div class="d-flex justify-content-center mt-1">
      <select class="form-select mx-1" style="width: 110px;">
        <option disabled selected>Month</option>
        <option>January</option><option>February</option><option>March</option>
        <option>April</option><option>May</option><option>June</option>
        <option>July</option><option>August</option><option>September</option>
        <option>October</option><option>November</option><option>December</option>
      </select>

      <select class="form-select mx-1" style="width: 90px;">
        <option disabled selected>Day</option>
        <script>for(let i=1;i<=31;i++) document.write(`<option>${i}</option>`);</script>
      </select>

      <select class="form-select mx-1" style="width: 110px;">
        <option disabled selected>Year</option>
        <script>
          const y = new Date().getFullYear();
          for(let i=y;i<=y+3;i++) document.write(`<option>${i}</option>`);
        </script>
      </select>
    </div>

    <!-- End Date -->
    <div class="text-center mt-4 fw-bold">End Date</div>
    <div class="d-flex justify-content-center mt-1">
      <select class="form-select mx-1" style="width: 110px;">
        <option disabled selected>Month</option>
        <option>January</option><option>February</option><option>March</option>
        <option>April</option><option>May</option><option>June</option>
        <option>July</option><option>August</option><option>September</option>
        <option>October</option><option>November</option><option>December</option>
      </select>

      <select class="form-select mx-1" style="width: 90px;">
        <option disabled selected>Day</option>
        <script>for(let i=1;i<=31;i++) document.write(`<option>${i}</option>`);</script>
      </select>

      <select class="form-select mx-1" style="width: 110px;">
        <option disabled selected>Year</option>
        <script>
          const year = new Date().getFullYear();
          for(let i=year;i<=year+3;i++) document.write(`<option>${i}</option>`);
        </script>
      </select>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-5 text-center text-body-secondary bg-body-tertiary">
    <p>Cover template built for <a href="https://getbootstrap.com/">Bootstrap</a>.</p>
    <p class="mb-0"><a href="#">Back to top</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
