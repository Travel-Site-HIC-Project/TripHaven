<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Sign in to TripHaven">
    <title>TripHaven: Sign In</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            min-height: 100vh;
        }

        .signin-section {
            position: relative;
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)),
                url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1600') center/cover;
            display: flex;
            flex-direction: column;
        }

        .signin-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        .signin-box {
            background: rgba(255, 255, 255, 0.98);
            padding: 50px 60px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 100%;
        }

        .signin-box h1 {
            color: #333;
            text-align: center;
            margin-bottom: 40px;
            font-size: 2rem;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #333;
            border-radius: 5px;
            font-size: 1rem;
            background: white;
            color: #333;
        }

        .form-input:focus {
            outline: none;
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1);
        }

        .signin-button {
            width: 100%;
            padding: 15px;
            background: #333;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
            transition: background 0.3s;
        }

        .signin-button:hover {
            background: #555;
        }

        .additional-links {
            margin-top: 25px;
            text-align: center;
            color: #333;
        }

        .additional-links a {
            color: #0d6efd;
            text-decoration: none;
        }

        .additional-links a:hover {
            text-decoration: underline;
        }

        .divider {
            margin: 30px 0;
            text-align: center;
            position: relative;
            color: #666;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 45%;
            height: 1px;
            background: #ccc;
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        .social-signin {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .social-button {
            flex: 1;
            padding: 12px;
            border: 2px solid #333;
            border-radius: 5px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
            color: #333;
        }

        .social-button:hover {
            background: #f8f9fa;
        }
    </style>
</head>

<body>

    <!-- Icons (required by matching header) -->
    <svg xmlns="http://www.w3.org/2000/svg" class="d-none">
        <symbol id="check2" viewBox="0 0 16 16">
            <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z" />
        </symbol>
        <symbol id="chevron-right" viewBox="0 0 16 16">
            <path fill-rule="evenodd"
                d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z">
            </path>
        </symbol>
    </svg>

    <!-- ★★★★★ Matching Header & Nav (Copied from Suggested Flights page) -->
    <div class="container">
        <header class="border-bottom lh-1 py-3">
            <div class="row flex-nowrap justify-content-between align-items-center">
                <div class="col-4 pt-1"></div>

                <div class="col-4 text-center">
                    <a class="blog-header-logo text-body-emphasis text-decoration-none" href="index.html">TripHaven</a>
                </div>

                <div class="col-4 d-flex justify-content-end align-items-center">

                    <a class="link-secondary" href="#" aria-label="Search">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"
                            stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            class="mx-3" role="img" viewBox="0 0 24 24">
                            <title>Search</title>
                            <circle cx="10.5" cy="10.5" r="7.5"></circle>
                            <path d="M21 21l-5.2-5.2"></path>
                        </svg>
                    </a>

                    <a class="link-secondary me-3" href="cart.html" aria-label="Cart">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                            viewBox="0 0 16 16">
                            <path
                                d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .49.598l-1 5a.5.5 0 0 1-.465.401l-9.397.472L4.415 11H13a.5.5 0 0 1 0 1H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5zM3.102 4l.84 4.479 9.144-.459L13.89 4H3.102zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z" />
                        </svg>
                    </a>

                    <a class="btn btn-sm btn-outline-secondary" href="signup.html">Sign up</a>
                </div>
            </div>
        </header>

        <div class="nav-scroller py-1 mb-3 border-bottom">
            <nav class="nav nav-underline justify-content-between">
                <a class="nav-item nav-link link-body-emphasis" href="travel.html">Travel</a>
                <a class="nav-item nav-link link-body-emphasis" href="reviews.html">Reviews</a>
                <a class="nav-item nav-link link-body-emphasis" href="suggested_flights.html">Suggested Flights</a>
                <a class="nav-item nav-link link-body-emphasis" href="discounts.html">Discounts</a>
            </nav>
        </div>
    </div>
    <!-- ★★★★★ End Matching Header -->

    <div class="signin-section">

        <!-- Sign-In Form -->
        <div class="signin-container">
            <div class="signin-box">
                <h1>Sign In</h1>

                <form onsubmit="handleSignIn(event)">
                    <div class="form-group">
                        <label class="form-label" for="username">Username</label>
                        <input type="text" id="username" class="form-input" placeholder="Enter your username" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" id="password" class="form-input" placeholder="Enter your password"
                            required>
                    </div>

                    <button type="submit" class="signin-button">Sign In</button>
                </form>

                <div class="additional-links">
                    <p>Don't have an account? <a href="signup.html">Sign up</a></p>
                    <p><a href="#">Forgot password?</a></p>
                </div>

                <div class="divider">OR</div>

                <div class="social-signin">
                    <button class="social-button" onclick="socialSignIn('Google')">Google</button>
                    <button class="social-button" onclick="socialSignIn('Facebook')">Facebook</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer class="py-5 text-center text-body-secondary bg-body-tertiary">
        <p>TripHaven - Your Adventure Begins Here | © 2025 TripHaven Inc.</p>
        <p class="mb-0">
            <a href="#">Privacy Policy</a> ·
            <a href="#">Terms of Service</a> ·
            <a href="#">Back to top</a>
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

    <script>
        function handleSignIn(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;

            alert(`Welcome back, ${username}!\n\nYou have successfully signed in.`);
            window.location.href = 'index.html';
        }

        function socialSignIn(provider) {
            alert(`Signing in with ${provider}...\n\nThis feature will connect to ${provider} authentication.`);
        }
    </script>

</body>

</html>
