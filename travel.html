    <style>
        .bd-placeholder-img {
            font-size: 1.125rem;
            text-anchor: middle;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none
        }

        .hero-section {
            position: relative;
            min-height: 600px;
            background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)),
                        url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1600') center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 3rem 1rem;
        }

        .search-title {
            background: rgba(0, 0, 0, 0.6);
            border: 3px solid rgba(255, 255, 255, 0.8);
            padding: 20px 80px;
            border-radius: 10px;
            margin-bottom: 3rem;
        }

        .search-title h1 {
            color: white;
            font-size: 3.5rem;
            font-weight: bold;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .search-container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            max-width: 1200px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        .search-input-wrapper {
            flex: 1;
            min-width: 300px;
            max-width: 600px;
        }

        .search-input {
            width: 100%;
            padding: 15px 20px 15px 50px;
            font-size: 1.1rem;
            border: 3px solid #333;
            border-radius: 50px;
            background: white;
            color: #333;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
        }

        .date-selector-wrapper {
            position: relative;
        }

        .date-selector-btn {
            padding: 15px 30px;
            font-size: 1.1rem;
            border: 3px solid #333;
            border-radius: 10px;
            background: white;
            color: #333;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 200px;
        }

        .date-selector-btn:hover {
            background: #f8f9fa;
        }

        .calendar-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 10px;
            background: white;
            border: 3px solid #333;
            border-radius: 10px;
            padding: 15px;
            display: none;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .calendar-dropdown.show {
            display: block;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: #333;
        }

        .calendar-header button {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px 10px;
            color: #333;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            color: #333;
        }

        .calendar-day-header {
            text-align: center;
            font-weight: bold;
            padding: 8px;
            color: #333;
        }

        .calendar-day {
            text-align: center;
            padding: 8px;
            cursor: pointer;
            border-radius: 5px;
            color: #333;
        }

        .calendar-day:hover {
            background: #e9ecef;
        }

        .calendar-day.selected {
            background: #0d6efd;
            color: white;
        }

        .calendar-day.disabled {
            color: #ccc;
            cursor: not-allowed;
        }

        .go-button {
            padding: 15px 60px;
            font-size: 1.3rem;
            border: 3px solid #333;
            border-radius: 10px;
            background: white;
            color: #333;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .go-button:hover {
            background: #333;
            color: white;
        }

        .help-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 12px 30px;
            background: white;
            border: 2px solid #333;
            border-radius: 5px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            z-index: 1000;
            color: #333;
        }

        .help-button:hover {
            background: #f8f9fa;
        }
    </style>
</head>

<body>

                <a class="nav-item nav-link link-body-emphasis" href="suggested_flights.html">Suggested Flights</a>

    <main>
        <div class="hero-section">
            <div class="search-title">
                <h1>Search Packages</h1>
            </div>

            <div class="search-container">
                <div class="search-input-wrapper position-relative">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" 
                         class="search-icon" viewBox="0 0 16 16">
                        <circle cx="6.5" cy="6.5" r="5.5" stroke="currentColor" stroke-width="1.5" fill="none"></circle>
                        <path d="M10.5 10.5l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
                    </svg>
                    <input type="text" 
                           class="search-input" 
                           id="locationSearch"
                           placeholder="Where would you like to travel? (cities/ countries)">
                </div>

                <div class="date-selector-wrapper">
                    <button class="date-selector-btn" id="dateSelector" onclick="toggleCalendar()">
                        <span id="dateDisplay">Select Dates</span>
                        <span>▼</span>
                    </button>
                    
                    <div class="calendar-dropdown" id="calendarDropdown">
                        <div class="calendar-header">
                            <button onclick="previousMonth()">◀</button>
                            <strong id="monthYear">NOVEMBER 2025</strong>
                            <button onclick="nextMonth()">▶</button>
                        </div>
                        <div class="calendar-grid" id="calendarGrid">
                            <!-- Calendar will be generated by JavaScript -->
                        </div>
                    </div>

            <div style="margin-top: 3rem;">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

    <script>
        let currentMonth = 10; // November (0-indexed)
        let currentYear = 2025;
        let selectedDates = [];

        const monthNames = [
            "JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE",
            "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"
        ];

        function toggleCalendar() {
            const dropdown = document.getElementById('calendarDropdown');
            dropdown.classList.toggle('show');
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const monthYearDisplay = document.getElementById('monthYear');
            
            monthYearDisplay.textContent = `${monthNames[currentMonth]} ${currentYear}`;
            
            // Clear existing calendar
            grid.innerHTML = '';
            
            // Add day headers
            const dayHeaders = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
            dayHeaders.forEach(day => {
                const header = document.createElement('div');
                header.className = 'calendar-day-header';
                header.textContent = day;
                grid.appendChild(header);
            });
            
            // Get first day of month and number of days
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            
            // Add empty cells for days before month starts
            for (let i = 0; i < firstDay; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.className = 'calendar-day disabled';
                grid.appendChild(emptyDay);
            }
            
            // Add days of month
            for (let day = 1; day <= daysInMonth; day++) {
                const dayCell = document.createElement('div');
                dayCell.className = 'calendar-day';
                dayCell.textContent = day;
                
                // Check if this date is selected
                const dateString = `${currentYear}-${currentMonth + 1}-${day}`;
                if (selectedDates.includes(dateString)) {
                    dayCell.classList.add('selected');
                }
                
                // Special styling for day 23
                if (day === 23 && currentMonth === 10 && currentYear === 2025) {
                    dayCell.style.color = '#0d6efd';
                    dayCell.style.fontWeight = 'bold';
                }
                
                dayCell.onclick = () => selectDate(day, dayCell);
                grid.appendChild(dayCell);
            }
        }

        function selectDate(day, element) {
            const dateString = `${currentYear}-${currentMonth + 1}-${day}`;
            
            if (selectedDates.includes(dateString)) {
                selectedDates = selectedDates.filter(d => d !== dateString);
                element.classList.remove('selected');
            } else {
                selectedDates.push(dateString);
                element.classList.add('selected');
            }
            
            updateDateDisplay();
        }

        function updateDateDisplay() {
            const display = document.getElementById('dateDisplay');
            if (selectedDates.length === 0) {
                display.textContent = 'Select Dates';
            } else if (selectedDates.length === 1) {
                display.textContent = `1 date selected`;
            } else {
                display.textContent = `${selectedDates.length} dates selected`;
            }
        }

        function previousMonth() {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        function nextMonth() {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            renderCalendar();
        }

        function searchPackages() {
            const location = document.getElementById('locationSearch').value;
            
            if (!location) {
                alert('Please enter a destination!');
                return;
            }
            
            if (selectedDates.length === 0) {
                alert('Please select at least one travel date!');
                return;
            }
            
            alert(`Searching packages for:\nDestination: ${location}\nDates: ${selectedDates.length} selected\n\nResults will be displayed here!`);
        }

        function showHelp() {
            alert('Travel Search Help:\n\n1. Enter your desired destination in the search box\n2. Click "Select Dates" to choose your travel dates\n3. Click "Go" to search for available packages\n\nNeed more assistance? Contact us at support@triphaven.com');
        }

        // Close calendar when clicking outside
        document.addEventListener('click', function(event) {
            const calendar = document.getElementById('calendarDropdown');
            const button = document.getElementById('dateSelector');
            
            if (!calendar.contains(event.target) && !button.contains(event.target)) {
                calendar.classList.remove('show');
            }
        });

        // Initialize calendar
        renderCalendar();
    </script>
